<body>
  <form name="contatto" data-netlify="true" hidden>
    <input type="text" name="nome" />
    <input type="email" name="email" />
    <textarea name="messaggio"></textarea>
  </form>
  <form name="guida-lofoten" data-netlify="true" hidden>

  </form>

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    // Intercept the two free-guide forms: send the lead to Netlify Forms in
    // the background (no page navigation) and open the PDF in a new tab in
    // the same synchronous gesture, so browsers don't treat it as a blocked
    // popup. The template's compiler turns required="" into a React prop,
    // and React treats an empty-string value for boolean DOM attributes
    // (required/disabled/checked/...) as falsy and drops the attribute, so
    // the browser's native required validation silently does nothing here -
    // the email is checked by hand instead, with setCustomValidity so the
    // browser still shows its normal validation bubble.
    document.addEventListener('submit', function (e) {
      var form = e.target;
      var name = form && form.getAttribute && form.getAttribute('name');
      if (name !== 'guida-lofoten' && name !== 'guida-islanda') return;
      var emailInput = form.querySelector('input[type="email"]');
      var email = emailInput ? emailInput.value.trim() : '';
      var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (emailInput && emailInput.setCustomValidity) {
        emailInput.setCustomValidity(emailOk ? '' : 'Inserisci la tua email per ricevere la guida.');
      }
      if (!emailOk) {
        e.preventDefault();
        if (emailInput && emailInput.reportValidity) emailInput.reportValidity();
        return;
      }
      e.preventDefault();
      var pdfUrl = form.getAttribute('action');
      if (pdfUrl) window.open(pdfUrl, '_blank');
      try {
        var body = new URLSearchParams(new FormData(form)).toString();
        fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body
        }).catch(function () {});
      } catch (err) {}
    });
  </script>

  <script>
    // Same root cause as the guide forms: required="" on nome/email/messaggio
    // compiles away to nothing once React renders the input, so the browser
    // never actually blocks an empty contact submission. Validate by hand
    // and let a valid submission through to its normal native POST (Netlify
    // Forms + its default confirmation page, unchanged).
    document.addEventListener('submit', function (e) {
      var form = e.target;
      var name = form && form.getAttribute && form.getAttribute('name');
      if (name !== 'contatto') return;
      var nomeInput = form.querySelector('input[name="nome"]');
      var emailInput = form.querySelector('input[name="email"]');
      var messaggioInput = form.querySelector('textarea[name="messaggio"]');
      var nome = nomeInput ? nomeInput.value.trim() : '';
      var email = emailInput ? emailInput.value.trim() : '';
      var messaggio = messaggioInput ? messaggioInput.value.trim() : '';
      var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

      if (nomeInput && nomeInput.setCustomValidity) {
        nomeInput.setCustomValidity(nome ? '' : 'Inserisci il tuo nome.');
      }
      if (emailInput && emailInput.setCustomValidity) {
        emailInput.setCustomValidity(emailOk ? '' : 'Inserisci una email valida.');
      }
      if (messaggioInput && messaggioInput.setCustomValidity) {
        messaggioInput.setCustomValidity(messaggio ? '' : 'Raccontami la tua idea di viaggio.');
      }

      if (!nome || !emailOk || !messaggio) {
        e.preventDefault();
        var firstInvalid = !nome ? nomeInput : (!emailOk ? emailInput : messaggioInput);
        if (firstInvalid && firstInvalid.reportValidity) firstInvalid.reportValidity();
      }
    });
  </script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      const __st = window.__bundlerStatic || (window.__bundlerStatic = JSON.parse((document.querySelector('script[type="__bundler/static"]') || {}).textContent || '{}'));
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
      else if (__st[entry.uuid]) resourceMap[entry.id] = __st[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

\" hint-placeholder-count=\"7\">\n      <sc-if value=\"{{ t.active }}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"flex:0 0 auto;border:1px solid transparent;background:#E4B65A;color:#35543F;font-family:'Work Sans',sans-serif;font-weight:500;font-size:0.85rem;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ t.notActive }}\" hint-placeholder-val=\"{{ true }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"flex:0 0 auto;border:1px solid transparent;background:transparent;color:#D9D2BF;font-family:'Work Sans',sans-serif;font-size:0.85rem;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;\" style-hover=\"color:#F6F1E4;border-color:rgba(246,241,228,0.18);\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<header style=\"position:relative;min-height:640px;display:flex;align-items:center;overflow:hidden;border-bottom:1px solid rgba(246,241,228,0.18);\">\n  <div style=\"position:absolute;inset:0;z-index:0;overflow:hidden;\">\n    <img src=\"/assets-b/56fb9dca-b67e-495d-ab5b-8313a2f877e6.jpg\" alt=\"Cascata di Seljalandsfoss, Islanda\" style=\"width:100%;height:100%;object-fit:cover;object-position:center 65%;\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(100deg, rgba(20,32,25,0.94) 0%, rgba(20,32,25,0.78) 34%, rgba(20,32,25,0.42) 62%, rgba(20,32,25,0.6) 100%);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:80px 32px;width:100%;\">\n    <div style=\"display:inline-flex;align-items:center;gap:10px;margin-bottom:28px;\">\n      <span style=\"width:7px;height:7px;border-radius:50%;background:#C6693F;box-shadow:0 0 0 4px rgba(198,105,63,0.2);\"><\u002Fspan>\n      <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;\">Travel Specialist<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:22px;margin-bottom:2px;\">\n      <div style=\"position:relative;flex:0 0 auto;width:140px;height:140px;border-radius:50%;overflow:hidden;border:2px solid #E4B65A;box-shadow:0 8px 22px rgba(0,0,0,0.35);\">\n        <img src=\"/assets-b/06ca7d31-1b70-4642-b095-e5c0de5fbd48.jpg\" alt=\"Tommaso al ghiacciaio di Sólheimajökull, Islanda\" style=\"width:100%;height:100%;object-fit:cover;object-position:5% 50%;display:block;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <h1 style=\"font-family:'Anton',sans-serif;font-weight:400;line-height:1.05;letter-spacing:0.005em;text-transform:uppercase;font-size:clamp(2.2rem,4.6vw,3.6rem);max-width:780px;color:#F6F1E4;margin:22px 0 0;\">Viaggi su misura per chi non cerca la meta, <span style=\"color:#E4B65A;\">ma la strada per arrivarci.<\u002Fspan><\u002Fh1>\n    <p style=\"max-width:520px;margin-top:26px;color:#D9D2BF;font-size:1.08rem;\">Sono consulente di viaggio specializzato in itinerari avventura e on the road. Niente pacchetti preconfezionati: costruisco rotte pensate su chi le percorre.<\u002Fp>\n    <div style=\"display:flex;gap:18px;margin-top:40px;flex-wrap:wrap;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ goToContatti }}\" style=\"background:#E4B65A;color:#35543F;padding:15px 30px;border-radius:999px;font-weight:500;font-size:0.95rem;font-family:inherit;border:none;cursor:pointer;\" style-hover=\"transform:translateY(-2px);box-shadow:0 8px 24px rgba(217,164,65,0.25);\">Racconta la tua prossima rotta<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ goToItinerari }}\" style=\"border:1px solid rgba(246,241,228,0.18);background:transparent;color:#F6F1E4;padding:15px 30px;border-radius:999px;font-size:0.95rem;font-family:inherit;cursor:pointer;\" style-hover=\"border-color:oklch(70% 0.13 250);color:oklch(70% 0.13 250);\">Guarda gli itinerari<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div aria-hidden=\"true\" style=\"position:relative;height:70px;max-width:1100px;margin:0 auto;padding:0 32px;\">\n  <svg sc-camel-view-box=\"0 0 1100 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:100%;display:block;\">\n    <path d=\"M0,35 C250,5 350,65 550,35 C750,5 850,65 1100,35\" fill=\"none\" stroke=\"oklch(70% 0.13 250)\" stroke-opacity=\"0.4\" stroke-width=\"1\" stroke-dasharray=\"1 6\"><\u002Fpath>\n  <\u002Fsvg>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isChiSono }}\" hint-placeholder-val=\"{{ true }}\">\n<section style=\"padding:110px 0;\" data-screen-label=\"Chi sono\">\n  <div style=\"max-width:1100px;margin:0 auto;padding:0 32px;\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:22px;\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;\">01 — Chi sono<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:rgba(246,241,228,0.18);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.01em;font-size:clamp(1.7rem,3vw,2.4rem);margin:0 0 20px;\">Prima di essere consulente, sono un viaggiatore<\u002Fh2>\n    <div style=\"background:#3F6249;border:1px solid rgba(246,241,228,0.18);border-radius:18px;padding:36px;margin-top:50px;max-width:680px;\">\n      <img src=\"/assets-b/6b20e04a-3f28-4305-9ef4-74185881426d.jpg\" alt=\"Tommaso davanti al ghiacciaio Perito Moreno, Patagonia\" style=\"width:100%;aspect-ratio:16/11;object-fit:cover;object-position:30% 30%;border-radius:12px;margin-bottom:20px;display:block;\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;display:block;margin-bottom:14px;\">La mia storia<\u002Fspan>\n      <p style=\"color:#F6F1E4;font-size:1.12rem;margin:0;\">Sono Tommaso e, prima ancora di essere un consulente di viaggio, mi definisco un viaggiatore curioso.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">Fin da bambino ho avuto la grande fortuna di viaggiare molto. Ho potuto conoscere luoghi, culture e paesaggi diversi e, crescendo, il viaggio è diventato sempre più parte di me.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">Poi, appena ne ho avuto la possibilità, ho iniziato a viaggiare per conto mio. Avevo voglia di uscire dalle solite rotte, lasciarmi alle spalle le mete più conosciute e andare alla ricerca di qualcosa di diverso, di luoghi capaci di sorprendermi davvero.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">La prima grande svolta è arrivata nel 2017, con un viaggio di dodici giorni in Scozia.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">Paesaggi spettacolari, natura sconfinata, laghi, castelli e tradizioni lontane dalla nostra quotidianità. Un viaggio che mi ha lasciato dentro una sensazione difficile da spiegare, ma molto semplice da riconoscere: avevo trovato qualcosa che mi affascinava davvero.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">La conferma è arrivata l'anno successivo, in Islanda.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">È stato amore a prima vista. Le stesse emozioni provate in Scozia, ma amplificate all'ennesima potenza: laghi glaciali, iceberg, cascate, vulcani e paesaggi talmente surreali da sembrare appartenere a un altro pianeta.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">E poi l'aurora boreale.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">La prima volta che l'ho vista danzare nel cielo mi sono sentito piccolo davanti a qualcosa di immensamente grande. Uno di quegli spettacoli che non si limitano a essere belli: rimangono dentro.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">È stato proprio in quel momento che ho capito una cosa: ero fatto per viaggiare verso questi luoghi e, soprattutto, per farli scoprire anche agli altri.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">Da allora la mia curiosità non si è più fermata. Ho esplorato gran parte della Scandinavia, ma anche destinazioni molto diverse tra loro: dall'Argentina, con la sua Patagonia e le maestose cascate di Iguazú, fino all'Asia Centrale, attraversando Uzbekistan, Kirghizistan e Kazakistan.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">C'è però un filo conduttore che unisce tutti questi viaggi: la ricerca di quei luoghi in cui la natura è ancora protagonista e l'uomo sembra quasi essere soltanto la cornice di un quadro straordinario.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">Ed è proprio questa passione che oggi porto nel mio lavoro.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">Come consulente di viaggio, non voglio semplicemente proporti una destinazione o prenotare un volo e un hotel. Voglio ascoltare ciò che cerchi in un viaggio, capire cosa ti emoziona e trasformarlo in un'esperienza costruita intorno a te.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">Perché credo che il viaggio perfetto non sia necessariamente quello più famoso o quello che va di moda.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">È quello che, una volta tornati a casa, continuiamo a raccontare.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"background:#3F6249;border:1px solid rgba(246,241,228,0.18);border-radius:18px;padding:36px;margin-top:50px;max-width:680px;\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:oklch(70% 0.13 250);display:block;margin-bottom:14px;\">Come lavoro<\u002Fspan>\n      <p style=\"color:#F6F1E4;font-size:1.12rem;margin:0;\">Dal 2024 questa passione è diventata anche il mio lavoro: sono consulente di viaggio per Evolution Travel. Non vendo pacchetti standard — ogni proposta nasce da un vero percorso di consulenza, costruito sulla persona che ho davanti.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">Si parte sempre da una consulenza telefonica: capisco cosa cerchi, quali sono i tuoi tempi, il tuo budget e il tuo stile di viaggio. Da lì costruisco una proposta su misura, che comprende itinerario, alloggi, mezzi di trasporto e tutta la documentazione necessaria.<\u002Fp>\n      <p style=\"color:#D9D2BF;margin-top:14px;\">Il mio ruolo di consulente non si esaurisce con la prenotazione: resto il tuo punto di riferimento anche a viaggio iniziato, pronto ad aiutarti se qualcosa cambia lungo il percorso.<\u002Fp>\n      <div style=\"display:flex;gap:40px;margin-top:34px;flex-wrap:wrap;\">\n        <div><div style=\"font-family:'Anton',sans-serif;font-size:2.1rem;color:#E4B65A;\">100%<\u002Fdiv><div style=\"font-size:0.82rem;color:#D9D2BF;margin-top:4px;\">itinerari su misura<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isServizi }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"position:relative;padding:110px 0;overflow:hidden;\" data-screen-label=\"Servizi\">\n  <div style=\"position:absolute;inset:0;z-index:0;\">\n    <img src=\"/assets-b/56fb9dca-b67e-495d-ab5b-8313a2f877e6.jpg\" alt=\"Cascata di Seljalandsfoss, Islanda\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 65%;\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(100deg, rgba(20,32,25,0.95) 0%, rgba(20,32,25,0.88) 45%, rgba(20,32,25,0.92) 100%);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 32px;\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:22px;\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;\">02 — Servizi<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:rgba(246,241,228,0.18);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(1.7rem,3vw,2.4rem);margin:0 0 20px;\">Perché contattarmi.<\u002Fh2>\n    <p style=\"color:#D9D2BF;max-width:620px;font-size:1.02rem;\">La differenza è nella conoscenza del luogo. Ti accompagno nella scelta della destinazione, costruisco un itinerario su misura e metto a tua disposizione l'esperienza maturata viaggiando personalmente nei luoghi che ti propongo.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,300px));justify-content:center;gap:24px;margin-top:50px;\">\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:18px;padding:32px 28px;\" style-hover=\"border-color:oklch(70% 0.13 250);\">\n        <div style=\"font-family:'Space Mono',monospace;font-size:0.75rem;color:#C6693F;\">01<\u002Fdiv>\n        <h3 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:1.2rem;margin-top:16px;color:#F6F1E4;\">Conosco i luoghi che propongo<\u002Fh3>\n        <p style=\"color:#D9D2BF;margin-top:12px;font-size:0.95rem;\">Non solo attraverso cataloghi e brochure, ma grazie all'esperienza diretta e alla conoscenza maturata viaggiando personalmente. Sono specializzato in Scandinavia, Islanda, Norvegia, Lapponia e destinazioni artiche — il cuore della mia esperienza e delle mie passioni — ma questo non significa che sia l'unica cosa che posso offrirti: contattami pure anche per altre mete.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:18px;padding:32px 28px;\" style-hover=\"border-color:oklch(70% 0.13 250);\">\n        <div style=\"font-family:'Space Mono',monospace;font-size:0.75rem;color:#C6693F;\">02<\u002Fdiv>\n        <h3 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:1.2rem;margin-top:16px;color:#F6F1E4;\">Creo viaggi personalizzati<\u002Fh3>\n        <p style=\"color:#D9D2BF;margin-top:12px;font-size:0.95rem;\">Ogni itinerario nasce dalle esigenze, dagli interessi e dal modo di viaggiare della persona che ho davanti. Logistica completa anche per viaggi di gruppo e famiglia con esigenze diverse — camere, orari, spostamenti — senza perdere lo spirito dell'avventura.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:18px;padding:32px 28px;\" style-hover=\"border-color:oklch(70% 0.13 250);\">\n        <div style=\"font-family:'Space Mono',monospace;font-size:0.75rem;color:#C6693F;\">03<\u002Fdiv>\n        <h3 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:1.2rem;margin-top:16px;color:#F6F1E4;\">Ti seguo personalmente<\u002Fh3>\n        <p style=\"color:#D9D2BF;margin-top:12px;font-size:0.95rem;\">Dalla prima idea fino al rientro a casa, con un rapporto diretto e un'assistenza costante. Quotazioni chiare, prenotazioni seguite passo passo e tutta la documentazione di viaggio pronta prima della partenza.<\u002Fp>\n        <p style=\"color:#D9D2BF;margin-top:16px;font-size:0.95rem;\">Vuoi parlarne direttamente con me? <a sc-camel-on-click=\"{{ goToContatti }}\" style=\"color:#E4B65A;text-decoration:underline;cursor:pointer;\">Scrivimi qui<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isItinerari }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"padding:110px 0;\" data-screen-label=\"Itinerari\">\n  <div style=\"max-width:1100px;margin:0 auto;padding:0 32px;\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:22px;\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;\">03 — Itinerari<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:rgba(246,241,228,0.18);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(1.7rem,3vw,2.4rem);margin:0 0 20px;\">Proposte pronte da vivere.<\u002Fh2>\n    <p style=\"color:#D9D2BF;max-width:620px;font-size:1.02rem;\">Itinerari pensati e costruiti su misura, con le tappe, i tempi e i consigli pratici per viverli davvero.<\u002Fp>\n\n    <sc-if value=\"{{ isItinerariGrid }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:24px;margin-top:50px;\">\n        <sc-for list=\"{{ packageCards }}\" as=\"p\" hint-placeholder-count=\"1\">\n          <a sc-camel-on-click=\"{{ p.onClick }}\" style=\"position:relative;border-radius:18px;overflow:hidden;cursor:pointer;height:420px;display:block;border:1px solid rgba(246,241,228,0.18);\">\n            <image-slot id=\"{{ p.cardSlot }}\" src=\"{{ p.heroSrc }}\" placeholder=\"Foto di copertina\" style=\"position:absolute;inset:0;width:100%;height:100%;\"><\u002Fimage-slot>\n            <div style=\"position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,32,25,0.05) 0%, rgba(20,32,25,0.3) 45%, rgba(20,32,25,0.94) 100%);pointer-events:none;\"><\u002Fdiv>\n            <div style=\"position:absolute;top:20px;left:20px;padding:5px 12px;border-radius:999px;background:oklch(70% 0.13 250);color:#1c2e22;font-family:'Space Mono',monospace;font-size:0.68rem;letter-spacing:0.08em;pointer-events:none;\">{{ p.duration }}<\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;bottom:0;padding:28px;pointer-events:none;\">\n              <span style=\"display:block;margin-bottom:8px;font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:oklch(70% 0.13 250);\">{{ p.coord }}<\u002Fspan>\n              <h3 style=\"font-family:'Anton',sans-serif;font-weight:400;font-size:1.4rem;color:#F6F1E4;text-transform:uppercase;margin:0 0 10px;\">{{ p.title }}<\u002Fh3>\n              <p style=\"color:#D9D2BF;font-size:0.92rem;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;\">{{ p.teaser }}<\u002Fp>\n              <span style=\"color:#E4B65A;font-size:0.85rem;\">Scopri l'itinerario →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:56px;padding:40px;background:#3F6249;border:1px solid rgba(246,241,228,0.18);border-radius:18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px;\">\n        <div style=\"max-width:520px;\">\n          <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;display:block;margin-bottom:12px;\">Nessuna rotta è definitiva<\u002Fspan>\n          <h3 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(1.2rem,2.4vw,1.6rem);color:#F6F1E4;margin:0 0 12px;\">Non hai trovato quello che cerchi? Costruiamolo assieme.<\u002Fh3>\n          <p style=\"color:#D9D2BF;font-size:0.98rem;line-height:1.7;margin:0;\">Questi itinerari sono un punto di partenza. Raccontami la tua idea di viaggio e la trasformo in una rotta su misura.<\u002Fp>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ goToContatti }}\" style=\"background:#E4B65A;color:#35543F;padding:15px 30px;border-radius:999px;font-weight:500;font-size:0.95rem;font-family:inherit;border:none;cursor:pointer;flex:0 0 auto;\" style-hover=\"transform:translateY(-2px);box-shadow:0 8px 24px rgba(217,164,65,0.25);\">Contattami<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isItinerariPackage }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style= Fdiv>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDiarioArticle }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"diario-sidebar-grid\" style=\"display:grid;grid-template-columns:220px 1fr;gap:48px;margin-top:50px;align-items:start;\">\n        <div>\n          <a sc-camel-on-click=\"{{ closeArticle }}\" style=\"position:fixed;top:78px;left:16px;z-index:40;display:inline-flex;align-items:center;gap:8px;background:rgba(20,35,28,0.85);backdrop-filter:blur(8px);border:1px solid rgba(246,241,228,0.18);color:#F6F1E4;font-size:0.85rem;font-weight:500;cursor:pointer;padding:10px 16px 10px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,0.3);\">← Tutti i racconti<\u002Fa>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <sc-for list=\"{{ articleCards }}\" as=\"a\" hint-placeholder-count=\"1\">\n              <a sc-camel-on-click=\"{{ a.onClick }}\" style=\"padding:12px 14px;border-radius:10px;cursor:pointer;background:{{ a.listBg }};\">\n                <span style=\"display:block;font-family:'Space Mono',monospace;font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;color:#E4B65A;\">{{ a.date }}<\u002Fspan>\n                <span style=\"display:block;margin-top:4px;font-size:0.9rem;color:#F6F1E4;\">{{ a.title }}<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <image-slot id=\"{{ articleData.heroSlot }}\" src=\"{{ articleData.heroSrc }}\" placeholder=\"Foto di copertina\" style=\"width:100%;aspect-ratio:16/9;border-radius:16px;display:block;\"><\u002Fimage-slot>\n          <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:oklch(70% 0.13 250);display:block;margin:24px 0 10px;\">{{ articleData.coord }}<\u002Fspan>\n          <h3 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(1.4rem,3vw,1.9rem);color:#F6F1E4;margin:0 0 8px;\">{{ articleData.title }}<\u002Fh3>\n          <div style=\"overflow:hidden;\">\n            <sc-for list=\"{{ articleBlocks }}\" as=\"b\" hint-placeholder-count=\"0\">\n              <sc-if value=\"{{ b.isP }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"color:#D9D2BF;font-size:1.02rem;line-height:1.75;margin:18px 0 0;\">{{ b.text }}<\u002Fp><\u002Fsc-if>\n              <sc-if value=\"{{ b.isH3 }}\" hint-placeholder-val=\"{{ false }}\"><h4 style=\"clear:both;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:1.15rem;color:#F6F1E4;margin:36px 0 0;\">{{ b.text }}<\u002Fh4><\u002Fsc-if>\n              <sc-if value=\"{{ b.isImg }}\" hint-placeholder-val=\"{{ false }}\">\n                <figure style=\"clear:both;width:62%;margin:28px auto 6px;\">\n                  <image-slot id=\"{{ b.slotId }}\" src=\"{{ b.src }}\" placeholder=\"{{ b.placeholder }}\" style=\"width:100%;aspect-ratio:4/3;border-radius:14px;display:block;\"><\u002Fimage-slot>\n                <\u002Ffigure>\n              <\u002Fsc-if>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isGuida }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"background:#3F6249;\" data-screen-label=\"Guida gratuita\">\n  <div style=\"position:relative;height:60vh;min-height:380px;max-height:560px;overflow:hidden;\">\n    <img src=\"/assets-b/f05bf1b2-5e1c-4553-840e-6d09b47f43cd.jpg\" alt=\"Laguna glaciale di Jökulsárlón al tramonto, Islanda\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,32,25,0.05) 0%, rgba(20,32,25,0.15) 50%, rgba(20,32,25,0.82) 100%);\"><\u002Fdiv>\n    <div style=\"position:absolute;left:0;right:0;bottom:0;padding:40px 32px;max-width:1100px;margin:0 auto;\">\n      <span style=\"display:block;margin-bottom:10px;font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;\">64.04° N, 16.18° O — Islanda<\u002Fspan>\n      <h3 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(1.3rem,2.6vw,1.9rem);color:#F6F1E4;max-width:640px;margin:0;\">Il ghiaccio che naviga verso il mare, un pezzo alla volta.<\u002Fh3>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1100px;margin:0 auto;padding:110px 32px;\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:22px;\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;\">05 — Guida gratuita<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:rgba(246,241,228,0.18);\"><\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:48px;align-items:center;background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:22px;padding:48px;position:relative;overflow:hidden;\">\n      <div style=\"position:relative;\">\n        <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;display:block;margin-bottom:12px;\">68.2° N, 13.6° E — Isole Lofoten<\u002Fspan>\n        <h3 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:1.5rem;color:#F6F1E4;margin-bottom:14px;\">Scarica la guida gratuita: Isole Lofoten<\u002Fh3>\n        <p style=\"color:#D9D2BF;font-size:0.98rem;margin-bottom:24px;\">Villaggi di pescatori, fiordi verticali e i cinque luoghi da non perdere. Iscriviti per ricevere subito il PDF con consigli pratici su quando andare, cosa vedere e come muoverti tra le isole.<\u002Fp>\n        <form name=\"guida-lofoten\" method=\"POST\" data-netlify=\"true\" action=\"/guides/guida-isole-lofoten.pdf\" target=\"_blank\" style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n          <input type=\"hidden\" name=\"form-name\" value=\"guida-lofoten\">\n          <input type=\"email\" name=\"email\" placeholder=\"La tua email\" required=\"\" aria-label=\"La tua email\" style=\"flex:1;min-width:200px;background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:10px;padding:13px 16px;color:#F6F1E4;font-family:'Work Sans',sans-serif;font-size:0.92rem;\">\n          <button type=\"submit\" style=\"background:#E4B65A;color:#35543F;border:none;padding:13px 24px;border-radius:10px;font-weight:500;font-size:0.92rem;cursor:pointer;font-family:'Work Sans',sans-serif;\" style-hover=\"transform:translateY(-2px);\">Scarica ora<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fdiv>\n      <div style=\"aspect-ratio:3/4;border-radius:14px;border:1px solid rgba(246,241,228,0.18);position:relative;overflow:hidden;\">\n        <img src=\"/assets-b/fb7137e2-df67-4d08-add3-b4983f29c6ce.jpg\" alt=\"Fiordi e villaggio delle Isole Lofoten\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n        <div style=\"position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,32,25,0) 55%, rgba(20,32,25,0.85) 100%);\"><\u002Fdiv>\n        <span style=\"position:absolute;left:22px;bottom:22px;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:1.1rem;color:#F6F1E4;\">Guida Isole Lofoten<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:48px;align-items:center;background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:22px;padding:48px;position:relative;overflow:hidden;margin-top:24px;\">\n      <div style=\"position:relative;\">\n        <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;display:block;margin-bottom:12px;\">64.96° N, 19.02° O — Islanda<\u002Fspan>\n        <h3 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:1.5rem;color:#F6F1E4;margin-bottom:14px;\">Scarica la guida gratuita: la valigia per l'Islanda<\u002Fh3>\n        <p style=\"color:#D9D2BF;font-size:0.98rem;margin-bottom:24px;\">Cosa portare, cosa lasciare a casa e gli errori più comuni da evitare per affrontare il clima islandese in ogni stagione. Iscriviti per ricevere subito il PDF con la checklist completa, capo per capo.<\u002Fp>\n        <form name=\"guida-islanda\" method=\"POST\" data-netlify=\"true\" action=\"/guides/la-valigia-in-islanda.pdf\" target=\"_blank\" style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n          <input type=\"hidden\" name=\"form-name\" value=\"guida-islanda\">\n          <input type=\"email\" name=\"email\" placeholder=\"La tua email\" required=\"\" aria-label=\"La tua email\" style=\"flex:1;min-width:200px;background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:10px;padding:13px 16px;color:#F6F1E4;font-family:'Work Sans',sans-serif;font-size:0.92rem;\">\n          <button type=\"submit\" style=\"background:#E4B65A;color:#35543F;border:none;padding:13px 24px;border-radius:10px;font-weight:500;font-size:0.92rem;cursor:pointer;font-family:'Work Sans',sans-serif;\" style-hover=\"transform:translateY(-2px);\">Scarica ora<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fdiv>\n      <div style=\"aspect-ratio:3/4;border-radius:14px;border:1px solid rgba(246,241,228,0.18);position:relative;overflow:hidden;\">\n        <img src=\"/assets-b/f983323f-66cf-4863-a1c8-425c4d5b4607.jpg\" alt=\"Le tradizionali case di torba islandesi con il tetto in erba\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n        <div style=\"position:absolute;inset:0;background:linear-gradient(180deg, rgba(20,32,25,0) 55%, rgba(20,32,25,0.85) 100%);\"><\u002Fdiv>\n        <span style=\"position:absolute;left:22px;bottom:22px;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:1.1rem;color:#F6F1E4;\">Guida Valigia Islanda<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRecensioni }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"position:relative;padding:110px 0;overflow:hidden;\" data-screen-label=\"Recensioni\">\n  <div style=\"position:absolute;inset:0;z-index:0;\">\n    <img src=\"/assets-b/56fb9dca-b67e-495d-ab5b-8313a2f877e6.jpg\" alt=\"Cascata di Seljalandsfoss, Islanda\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 65%;\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(100deg, rgba(20,32,25,0.95) 0%, rgba(20,32,25,0.88) 45%, rgba(20,32,25,0.92) 100%);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 32px;\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:22px;\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;\">06 — Recensioni<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:rgba(246,241,228,0.18);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(1.7rem,3vw,2.4rem);margin:0 0 20px;\">Cosa raccontano i miei viaggiatori.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:50px;\">\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Un viaggio strepitoso, forse il più bello mai fatto. Organizzato nei dettagli come richiesto, ci ha fatto scoprire posti che nemmeno pensavamo potessero esistere.\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Daria<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Isole Lofoten<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Islanda fly&amp;drive con due bambine: non sarebbe stato così perfetto se non fosse stato organizzato in modo eccellente, curato nei dettagli.\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Paola<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Islanda<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Fin dal primo contatto è stato attento alle mie esigenze, proponendo un itinerario su misura che univa paesaggi mozzafiato ed esperienze autentiche.\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Lucia<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Scozia<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Viaggio indimenticabile, non solo per i paesaggi ma anche per l'organizzazione curata nei minimi particolari, dall'aurora boreale al pernottamento.\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Antonella<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Islanda on the road<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Sempre disponibile a chiarimenti e richieste di aiuto, anche in tempi rapidi. Avere un punto di riferimento così è stato fondamentale.\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Marina<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Islanda<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Curato tutto nei minimi dettagli, sempre disponibile prima e durante il viaggio per qualsiasi dubbio, anche a distanza.\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Angelica<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Islanda<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Ho organizzato le vacanze estive in Kazakistan attraverso Evolution Travel e non posso che essere incredibilmente soddisfatta del servizio ricevuto. Il viaggio è stato stupendo, grazie soprattutto a Tommaso Alvares, il nostro consulente, che ha capito le mie esigenze ed è stato sempre disponibile per adattare l'itinerario in base ai nostri punti di maggiore interesse. Quello che ha fatto senza dubbio la differenza è la grande professionalità, la passione che ci ha trasmesso e una gentilezza fuori dal comune. Non vedo l'ora di organizzare la prossima partenza!\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Eleonora<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Kazakistan<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Due settimane bellissime tra Slovenia, Croazia e Trentino, un itinerario pensato su misura per la nostra famiglia con due bimbi piccoli. Tommaso sempre presente, disponibile e preciso: da rifare anche su altri itinerari.\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Mattia<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Slovenia, Croazia e Trentino<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Esperienza di prenotazione impeccabile, 10/10 sotto ogni punto di vista. Soluzioni di viaggio consigliate con grande precisione e un'esperienza costruita su misura, con una cura per il cliente davvero rara.\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Gianni<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Edimburgo<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Io e il mio compagno sognavamo l'Islanda ma economicamente ci sembrava un'utopia. Tommaso lo ha reso realtà, creato su misura per le nostre possibilità e il nostro tempo, seguendoci passo dopo passo in ogni dettaglio. Questo viaggio ci ha cambiato la vita, grazie!\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Federica<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Islanda<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:16px;padding:26px;\">\n        <div style=\"color:#E4B65A;font-size:0.85rem;letter-spacing:2px;margin-bottom:12px;\">★★★★★<\u002Fdiv>\n        <p style=\"color:#D9D2BF;font-size:0.92rem;line-height:1.55;margin:0;\">\"Ci siamo affidati a Tommaso per la nostra vacanza in Sardegna ed è stata la scelta migliore. Disponibile, attento e professionale, ha saputo ascoltare le nostre esigenze aiutandoci a trovare la struttura perfetta. Un'esperienza senza stress, da consigliare a chiunque.\"<\u002Fp>\n        <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(246,241,228,0.18);display:flex;justify-content:space-between;align-items:baseline;\">\n          <span style=\"font-size:0.9rem;color:#F6F1E4;font-weight:500;\">Andrea<\u002Fspan><span style=\"font-family:'Space Mono',monospace;font-size:0.68rem;color:#A9C2AE;text-transform:uppercase;letter-spacing:0.06em;\">Sardegna<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isContatti }}\" hint-placeholder-val=\"{{ false }}\">\n<section style=\"position:relative;padding:110px 0;overflow:hidden;\" data-screen-label=\"Contatti\">\n  <div style=\"position:absolute;inset:0;z-index:0;\">\n    <img src=\"/assets-b/56fb9dca-b67e-495d-ab5b-8313a2f877e6.jpg\" alt=\"Cascata di Seljalandsfoss, Islanda\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 65%;\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(100deg, rgba(20,32,25,0.95) 0%, rgba(20,32,25,0.88) 45%, rgba(20,32,25,0.92) 100%);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 32px;\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:22px;\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;\">07 — Contatti<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:rgba(246,241,228,0.18);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(1.7rem,3vw,2.4rem);margin:0 0 20px;\">Dove vuoi arrivare?<\u002Fh2>\n    <p style=\"color:#D9D2BF;max-width:620px;font-size:1.02rem;\">Raccontami due righe sulla tua idea di viaggio: parti sta<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<footer style=\"border-top:1px solid rgba(246,241,228,0.18);padding:40px 0;\">\n  <div style=\"max-width:1100px;margin:0 auto;padding:0 32px;display:flex;justify-content:space-between;align-items:center;font-size:0.82rem;color:#D9D2BF;flex-wrap:wrap;gap:12px;\">\n    <span>© 2026 Alvagando — Consulenza di viaggio<\u002Fspan>\n    <span style=\"font-family:'Space Mono',monospace;font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:#E4B65A;\">Sempre in rotta<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ tripOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;background:rgba(10,20,15,0.82);backdrop-filter:blur(4px);z-index:200;padding:40px 20px;overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;\" sc-camel-on-click=\"{{ onOverlayClick }}\">\n    <div style=\"position:relative;background:#35543F;border:1px solid rgba(246,241,228,0.18);border-radius:22px;max-width:900px;width:100%;margin:auto;overflow:hidden;animation:tripModalIn 0.3s ease;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ closeTrip }}\" aria-label=\"Chiudi\" style=\"position:absolute;top:18px;right:18px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid rgba(241,233,216,0.3);background:rgba(10,20,15,0.55);color:#F6F1E4;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;\">×<\u002Fbutton>\n\n      <sc-if value=\"{{ isLoadingTrip }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:80px 44px;text-align:center;color:#D9D2BF;\">Caricamento...<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasTripData }}\" hint-placeholder-val=\"{{ false }}\">\n      <image-slot id=\"{{ tripData.heroSlotId }}\" src=\"{{ tripData.heroSrc }}\" placeholder=\"Foto di copertina\" style=\"width:100%;aspect-ratio:16/9;display:block;\"><\u002Fima 2, src: remap(b.img2.src) } : b.img2 };\n          return b;\n        })\n      };\n    });\n    this.setState({ tripsData: remapped, articlesData: remapArt, packagesData: remapPkg });\n  }\n\n  setTab(id) { this.setState({ activeTab: id }); window.scrollTo({ top: 0, behavior: 'instant' }); }\n  openTrip(id) { this.setState({ activeTrip: id }); }\n  closeTrip() { this.setState({ activeTrip: null }); }\n  openArticle(id) { this.setState({ activeArticle: id }); window.scrollTo({ top: 0, behavior: 'instant' }); }\n  closeArticle() { this.setState({ activeArticle: null }); }\n  openPackage(id) { this.setState({ activePackage: id }); window.scrollTo({ top: 0, behavior: 'instant' }); }\n  closePackage() { this.setState({ activePackage: null }); }\n\n  ctaClick(tripName) {\n    this.setState({ activeTrip: null, activeTab: 'contatti', messagePrefill: 'Sono interessato al viaggio: ' + tripName + '\\n\\n' });\n  }\n\n  openCalendly(e) {\n    if (window.Calendly) {\n      e.preventDefault();\n      Calendly.initPopupWidget({ url: 'https://calendly.com/tommaso-alvares/consulenza-di-viaggio' });\n    }\n  }\n\n  renderVals() {\n    const TAB_LIST = [\n      { id: 'home', label: 'Home' },\n      { id: 'chi-sono', label: 'Chi sono' },\n      { id: 'servizi', label: 'Servizi' },\n      { id: 'itinerari', label: 'Itinerari' },\n      { id: 'diario', label: 'Diario' },\n      { id: 'guida-gratuita', label: 'Guida gratuita' },\n      { id: 'recensioni', label: 'Recensioni' },\n      { id: 'contatti', label: 'Contatti' }\n    ];\n    const activeTab = this.state.activeTab;\n    const articlesData = this.state.articlesData || {};\n    const activeArticle = this.state.activeArticle;\n    const ARTICLE_ORDER = ['islanda', 'norvegia', 'svezia', 'scozia', 'azzorre', 'argentina', 'uzbekistan', 'kirghizistan', 'kazakistan'];\n    const articleIds = Object.keys(articlesData).sort((a, b) => ARTICLE_ORDER.indexOf(a) - ARTICLE_ORDER.indexOf(b));\n    const articleCards = articleIds.map((aid) => {  || []).map((n, i) => ({\n      key: 'note-' + i, title: n.title, text: n.text,\n      hasLink: !!n.linkLabel, linkLabel: n.linkLabel, textAfter: n.textAfter,\n      onLink: () => this.setTab(n.linkTab || 'guida-gratuita')\n    })) : [];\n    const optional = packageData && packageData.optional ? packageData.optional : null;\n    const optionalItems = optional ? (optional.items || []).map((t, i) => ({ key: 'opt-' + i, text: t })) : [];\n    const packageInfo = packageData ? (packageData.info || []).map((it, i) => ({\n      key: 'info-' + i, label: it.label, text: it.text,\n      hasLink: !!it.linkLabel, linkLabel: it.linkLabel, textAfter: it.textAfter,\n      onLink: () => this.setTab(it.linkTab || 'guida-gratuita')\n    })) : [];\n    const packageHighlights = packageData ? (packageData.highlights || []).map((t, i) => ({ key: 'hl-' + i, text: t })) : [];\n    const tabs = TAB_LIST.map(t => ({\n      id: t.id,\n      label: t.label,\n      active: t.id === activeTab,\n      notActive: t.id !== activeTab,\n      onClick: () => this.setTab(t.id)\n    }));\n\n    const ACCENTS = { scozia: '#C6693F', svezia: '#E4B65A', islanda: 'oklch(70% 0.13 250)', norvegia: '#A9C2AE' };\n    const TRIP_NAMES = { scozia: 'Scozia', svezia: 'Svezia', islanda: 'Islanda', norvegia: 'Norvegia' };\n\n    const tripOpen = !!this.state.activeTrip;\n    let tripData = null;\n    let tripBlocks = [];\n    let tripAccent = '#E4B65A';\n    const isLoadingTrip = tripOpen && !this.state.tripsData;\n\n    if (tripOpen && this.state.tripsData) {\n      const raw = this.state.tripsData[this.state.activeTrip];\n      tripAccent = ACCENTS[this.state.activeTrip];\n      if (raw) {\n        tripData = raw;\n        const arr = raw.blocks || [];\n        tripBlocks = arr.map((b, i) => {\n          const next = arr[i + 1];\n          const prev = arr[i - 1];\n          const attachedCaption = (b.type === 'img' || b.type === 'gallery2') && next && next.type === 'caption' ? next.text : null;\n          const isCaptionAttached = b.type === 'caption' && prev && (prev.type === 'img' || prev.type === 'gallery2');\n          return {\n            key: this.state.activeTrip + '-' + i,\n            isP: b.type === 'p',\n            isImgFull: b.type === 'img' && !b.small,\n            isImgSmall: b.type === 'img' && !!b.small,\n            isGallery: b.type === 'gallery2',\n            isCaption: b.type === 'caption' && !isCaptionAttached,\n            isDivider: b.type === 'divider',\n            isCta: b.type === 'cta',\n            caption: attachedCaption,\n            text: b.text,\n            src: b.src,\n            alt: b.alt,\n            img1: b.imgs ? b.imgs[0] : null,\n            img2: b.imgs ? b.imgs[1] : null,\n            h3: b.h3,\n            p: b.p,\n            label: b.label,\n            onClickCta: () => this.ctaClick(b.tripName || TRIP_NAMES[this.state.activeTrip] || 'questo viaggio')\n          };\n        });\n      }\n    }\n\n    return {\n      tabs,\n      isHome: activeTab === 'home',\n      isChiSono: activeTab === 'chi-sono',\n      isServizi: activeTab === 'servizi',\n      isItinerari: activeTab === 'itinerari',\n      isItinerariGrid: activeTab === 'itinerari' && !activePackage,\n      isItinerariPackage: activeTab === 'itinerari' && !!activePackage,\n      packageCards,\n      packageData,\n      packageDays,\n      packageGallery,\n      packageNotes,\n      hasNotes: packageNotes.length > 0,\n      hasOptional: !!optional,\n      optionalTitle: optional ? optional.title : '',\n      optionalIntro: optional ? optional.intro : '',\n      optionalItems,\n      packageInfo,\n      packageHighlights,\n      closePackage: () => this.closePackage(),\n      isDiario: activeTab === 'diario',\n      isDiarioGrid: activeTab === 'diario' && !activeArticle,\n      isDiarioArticle: activeTab === 'diario' && !!activeArticle,\n      articleCards,\n      articleData,\n      articleBlocks,\n      closeArticle: () => this.closeArticle(),\n      isGuida: ac
